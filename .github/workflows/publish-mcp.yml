name: Publish MCP server to the official registry

on:
  push:
    branches: [main]
    paths: ['server.json', '.github/workflows/publish-mcp.yml']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install mcp-publisher
        run: |
          curl -sL https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz -o pub.tgz
          tar -xzf pub.tgz mcp-publisher && chmod +x mcp-publisher && sudo mv mcp-publisher /usr/local/bin/
      - name: Login (GitHub OIDC)
        run: mcp-publisher login github-oidc
      - name: Validate + publish
        run: |
          mcp-publisher validate server.json
          mcp-publisher publish server.json
